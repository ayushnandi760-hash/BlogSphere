services:
  # BlogSphere Spring Boot Backend Web Service
  - type: web
    name: blogsphere-api
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/blogsphere-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/blogs
    envVars:
      - key: DB_HOST
        sync: false          # Set this in Render dashboard (your MySQL host)
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: blogsphere_db
      - key: DB_USERNAME
        sync: false          # Set this in Render dashboard
      - key: DB_PASSWORD
        sync: false          # Set this in Render dashboard
      - key: blogsphere.app.jwtSecret
        generateValue: false  # Paste your 256-bit hex secret in dashboard
      - key: blogsphere.app.jwtExpirationMs
        value: "86400000"
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
      - key: server.port
        value: "8080"
